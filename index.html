<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swiss Flight Recap</title>

    <link rel="stylesheet" href="css/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="website">
      <div class="sidebar">
        <div class="flight-board">
          <div class="flight-board-header">
            <div class="plane-icon">✈</div>
            <h2>Zürich</h2>
          </div>

          <table class="flight-table">
            <thead>
              <tr>
                <th>TIME</th>
                <th class="destination-title-cell">DESTINATION</th>
              </tr>
            </thead>

            <tbody class="flight-table-body" id="flight-table-body-1">
              <tr>
                <td>08:35</td>
                <td class="destination-cell">Zürich</td>
              </tr>
              <tr>
                <td>09:20</td>
                <td class="destination-cell">GENEVA</td>
              </tr>
              <tr>
                <td>10:05</td>
                <td class="destination-cell">BASEL</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="flight-board">
          <div class="flight-board-header">
            <div class="plane-icon">✈</div>
            <h2>Bern</h2>
          </div>

          <table class="flight-table">
            <thead>
              <tr>
                <th>TIME</th>
                <th class="destination-title-cell">DESTINATION</th>
              </tr>
            </thead>

            <tbody class="flight-table-body" id="flight-table-body-2">
              <tr>
                <td>11:15</td>
                <td class="destination-cell">LUGANO</td>
              </tr>
              <tr>
                <td>12:40</td>
                <td class="destination-cell">SION</td>
              </tr>
              <tr>
                <td>13:25</td>
                <td class="destination-cell">BERN</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="flight-board">
          <div class="flight-board-header">
            <div class="plane-icon">✈</div>
            <h2>Genf</h2>
          </div>

          <table class="flight-table">
            <thead>
              <tr>
                <th>TIME</th>
                <th class="destination-title-cell">DESTINATION</th>
              </tr>
            </thead>

            <tbody class="flight-table-body" id="flight-table-body-3">
              <tr>
                <td>14:10</td>
                <td class="destination-cell">LUZERN</td>
              </tr>
              <tr>
                <td>15:30</td>
                <td class="destination-cell">DAVOS</td>
              </tr>
              <tr>
                <td>16:45</td>
                <td class="destination-cell">CHUR</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <main class="content">
        <div class="red-box">
          <div class="red-content image-wrap">
            <img id="switzerland" src="sources/img/switzerland_transp.png" />
            <img id="plane-template" src="sources/img/plane.png" alt="Plane" />
          </div>

          <div class="red-footer">
            <div class="red-footer-small">
              <input
                type="image"
                id="animation-button"
                class="button"
                src="sources/img/button.png"
              />
            </div>

            <div class="red-footer-large">
              <div class="timeline">
                <div class="timeline-line"></div>

                <div id="timeline-progress" class="timeline-progress"></div>

                <div class="bar bar-edge bar-left"></div>

                <div class="bar bar-small bar-quarter-left"></div>
                <div class="bar bar-small bar-center"></div>
                <div class="bar bar-small bar-quarter-right"></div>

                <div class="bar bar-edge bar-right"></div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="js/script.js" type="module"></script>
  </body>
</html>
